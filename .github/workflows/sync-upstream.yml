name: Sync upstream

# Keeps this fork current with tobilg/polyglot. Every Monday (and on manual
# dispatch) it merges upstream/main into a `sync-upstream` branch and opens a
# PR for review. Clean weeks -> a CI-green PR you click merge on; conflicting
# weeks -> an issue with the exact commands to resolve it locally.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT (secret SYNC_PAT) lets the opened PR trigger CI; the default
          # GITHUB_TOKEN cannot trigger further workflow runs. Falls back to it.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/tobilg/polyglot.git 2>/dev/null || true
          git fetch upstream --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          behind=$(git rev-list --count origin/main..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream/main is $behind commit(s) ahead of origin/main"

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B sync-upstream origin/main
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push branch and open/update PR (clean merge)
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git push --force-with-lease origin sync-upstream
          if gh pr view sync-upstream --json number >/dev/null 2>&1; then
            echo "PR already open; force-push updated it."
          else
            gh pr create --base main --head sync-upstream \
              --title "Sync upstream tobilg/polyglot ($(date -u +%Y-%m-%d))" \
              --body "Automated weekly merge of \`upstream/main\` (${{ steps.check.outputs.behind }} new commit(s)). Merged cleanly — review the diff and let CI pass before merging. If CI did not run, add a \`SYNC_PAT\` repo secret (a PAT with repo scope) so the bot-opened PR can trigger workflows."
          fi

      - name: Open issue (merge conflicts need manual resolution)
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync needs manual conflict resolution"
          gh issue list --state open --search "in:title $title" --json title \
            --jq '.[].title' | grep -qF "$title" && { echo "conflict issue already open"; exit 0; }
          gh issue create \
            --title "$title" \
            --body $'Merging \`upstream/main\` into \`main\` hit conflicts. Resolve locally:\n\n```bash\ngit fetch upstream\ngit checkout -b sync-upstream origin/main\ngit merge upstream/main   # resolve conflicts\ncargo test -p polyglot-sql --lib --features transpile\ngit push -u origin sync-upstream\ngh pr create --base main --title \"Sync upstream tobilg/polyglot\"\n```\n\nConflicts usually cluster in `dialects/mod.rs`, `datafusion.rs`, `generator.rs`, `ci.yml`.'
